repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # These must match what CI installs. With them missing, mypy resolves
        # fastapi and httpx to Any under ignore_missing_imports and the hook
        # quietly passes things CI then fails on.
        additional_dependencies:
          - pydantic>=2.6
          - fastapi>=0.110
          - httpx>=0.27
          - pytest>=8.0
        exclude: ^src/

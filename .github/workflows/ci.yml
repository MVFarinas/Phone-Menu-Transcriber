name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No ffmpeg and no torch here: Whisper is an optional extra, so these jobs
      # stay light and fast. The `whisper` job below covers that path.
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Test (pytest + coverage)
        run: pytest --cov-report=xml

  whisper:
    # Speech-to-text drags in torch, so it gets one job rather than slowing all
    # six test jobs down. This is also the only place the model-list drift test
    # actually runs, since it skips wherever Whisper cannot be imported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package with the whisper extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,whisper]"

      - name: Smoke-test the Whisper integration
        run: |
          python -c "import whisper; print('whisper', whisper.__version__)"
          pytest tests/test_pipeline.py tests/test_transcription.py -q --no-cov
